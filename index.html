<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>圣诞钢琴日历树</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#03040c;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#f3f3f3}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#help{position:fixed;left:16px;top:16px;max-width:380px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);border-radius:14px;padding:14px 18px;font-size:14px;line-height:1.85;display:none;z-index:5}
#help h3{font-size:16px;margin-bottom:4px}
#help .k{color:#9a9a9a;font-size:12px;margin-top:4px}
#langBtn{position:fixed;right:16px;top:16px;width:200px;z-index:45;background:rgba(30,32,40,.85);color:#ffe08a;border:1px solid rgba(255,215,130,.35);border-radius:10px;padding:10px;font-size:14px;cursor:pointer;font-family:inherit}
#langBtn:hover{background:rgba(50,52,62,.9)}
#side{position:fixed;right:16px;top:68px;display:none;flex-direction:column;gap:10px;width:200px;z-index:26}
#side button,#side label{background:rgba(30,32,40,.85);color:#eee;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px;font-size:14px;cursor:pointer;text-align:center;display:flex;justify-content:center;align-items:center;gap:6px;font-family:inherit}
#side button:hover,#side label:hover{background:rgba(50,52,62,.9)}
#side button.on{background:#ffb84d;color:#222}
#status{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:8px 20px;border-radius:20px;font-size:15px;white-space:nowrap;display:none;z-index:5}
#cam{position:fixed;left:2px;bottom:1.7vh;width:23.4vw;height:auto;aspect-ratio:16/9;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.15);background:#000;display:none;z-index:7;cursor:move;touch-action:none;user-select:none}
#cam:hover{border-color:rgba(255,215,130,.6)}
#camRz{position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;z-index:2;background:linear-gradient(135deg,transparent 50%,rgba(255,215,130,.85) 50%,rgba(255,215,130,.85) 58%,transparent 58%,transparent 70%,rgba(255,215,130,.85) 70%,rgba(255,215,130,.85) 78%,transparent 78%)}
#camTip{position:absolute;left:0;right:0;top:0;padding:3px 6px;font-size:11px;color:#fff;background:linear-gradient(rgba(0,0,0,.55),transparent);opacity:0;transition:opacity .2s;pointer-events:none;z-index:2}
#cam:hover #camTip{opacity:1}
.modes{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:14px;font-size:14px;color:#ffe9c9}
.modes .dwell span{background:rgba(255,255,255,.12);box-shadow:none;font-size:15px;padding:9px 16px;font-weight:500}
.modes .dwell.sel span{background:linear-gradient(135deg,#f4c95d,#d99a1e);color:#3a1d00;font-weight:700}
#cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:.75}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(10px);background:rgba(20,22,30,.9);border:1px solid rgba(255,215,130,.35);padding:10px 22px;border-radius:22px;font-size:15px;opacity:0;transition:all .3s;pointer-events:none;z-index:30;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* 日历卡片 */
#card{position:fixed;left:50%;top:50%;width:min(26vw,40vh);background:#fff;padding:12px 12px 0;border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(255,220,140,.25);transform:translate(-50%,-50%) scale(.3) rotate(-10deg);opacity:0;transition:transform .5s cubic-bezier(.2,1.5,.4,1),opacity .35s;pointer-events:none;z-index:15}
#card.show{transform:translate(-50%,-50%) scale(1) rotate(-2deg);opacity:1}
#card .ph{width:100%;aspect-ratio:3/4;overflow:hidden;background:#ddd}
#card img{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
#cardCap{color:#333;font-size:15px;text-align:center;padding:12px 6px 14px;line-height:1.5}
/* 开始页 */
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at center,#0d1430 0%,#03040c 70%);z-index:40}
#start h1{font-size:40px;letter-spacing:2px}
#start p{color:#aaa;font-size:15px}
#start button{font-size:20px;padding:14px 40px;border-radius:30px;border:none;background:linear-gradient(135deg,#d7263d,#a10f2b);color:#fff;cursor:pointer;box-shadow:0 0 30px rgba(215,38,61,.5);font-family:inherit}
/* Are you ready 弹窗 */
#ready{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:25;background:rgba(0,0,0,.35)}
#ready.show{display:flex}
.cane{padding:10px;border-radius:28px;background:repeating-linear-gradient(45deg,#fff 0 14px,#d7263d 14px 28px);box-shadow:0 0 60px rgba(255,210,120,.35);animation:pop .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.rbox{position:relative;width:min(580px,90vw);max-height:88vh;overflow-y:auto;background:radial-gradient(ellipse at top,#c8183a,#7d0a20 75%);border-radius:20px;padding:34px 38px 26px;overflow:hidden}
.rbox .deco{position:absolute;font-size:34px}
.rbox h2{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:50px;text-align:center;color:#ffd978;text-shadow:0 0 18px rgba(255,210,100,.8),0 2px 0 #7a4a00;margin-bottom:16px}
.rbox ul{list-style:none;font-size:15.5px;line-height:2;color:#fff3e6;background:rgba(0,0,0,.18);border-radius:12px;padding:10px 16px}
.rbox .go{text-align:center;font-size:24px;color:#ffe08a;margin-top:18px;font-weight:600;animation:breath 1.4s ease-in-out infinite}
.rbox .go span{display:inline-block;animation:clap .7s ease-in-out infinite}
@keyframes breath{50%{opacity:.7}}
@keyframes clap{50%{transform:scale(1.35) rotate(-10deg)}}
.clapTip{text-align:center;color:#ffd9d9;font-size:13px;margin-top:6px}
#clapMeter{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:10px;font-size:13px;color:#fff}
#clapMeter .bar{width:180px;height:8px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}
#clapMeter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe08a,#fff);transition:width .08s}
#banner{position:fixed;left:50%;top:14px;transform:translateX(-50%);display:none;align-items:center;gap:18px;z-index:6;white-space:nowrap}
#banner .txt{color:#ffe9b0;font-size:16px;text-shadow:0 0 12px rgba(255,200,100,.7)}
/* 可以用一根手指“停留”点击的按钮：外圈是进度环 */
.dwell{--p:0;position:relative;border:none;cursor:pointer;font-family:inherit;border-radius:40px;padding:3px;background:conic-gradient(#ffe08a calc(var(--p)*1turn),rgba(255,255,255,.25) 0)}
.dwell span{display:flex;align-items:center;gap:8px;border-radius:40px;background:linear-gradient(135deg,#c8183a,#8a0c24);color:#fff;font-size:17px;font-weight:600;padding:12px 26px;box-shadow:0 0 22px rgba(255,80,100,.45)}
.dwell.hot span{background:linear-gradient(135deg,#e0244a,#a8102e);transform:scale(1.04)}
.dwell small{font-weight:400;font-size:12px;opacity:.75}
/* 最终贺卡 */
#replayBtn{position:fixed;left:18px;top:16px;z-index:27;display:none}
#greet{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:28;pointer-events:none}
#greet.show{display:flex}
#greet .gcard{pointer-events:auto;width:min(620px,88vw);padding:10px;border-radius:26px;background:linear-gradient(135deg,#f4d27a,#fff3c4,#d9a93a);box-shadow:0 0 80px rgba(255,210,120,.55);animation:gpop .9s cubic-bezier(.2,1.5,.4,1)}
@keyframes gpop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
#greet .gin{position:relative;overflow:hidden;border-radius:18px;background:radial-gradient(ellipse at top,#c8183a,#6e0819 80%);padding:40px 34px 30px;text-align:center}
#greet .en{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:58px;color:#ffd978;text-shadow:0 0 22px rgba(255,210,100,.9),0 2px 0 #7a4a00}
#greet .zh{font-size:28px;color:#fff;margin-top:14px;letter-spacing:2px;line-height:1.6;text-shadow:0 2px 8px rgba(0,0,0,.35)}
#greet .row{font-size:38px;margin:10px 0 4px}
#greet .gfoot{margin-top:22px;display:flex;justify-content:center}
#greet .dwell span{background:linear-gradient(135deg,#1f7a3a,#0f5a28);box-shadow:0 0 22px rgba(80,220,120,.4)}
.rbox .alt{text-align:center;margin-top:12px}
.rbox .alt button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:16px;padding:6px 16px;font-size:13px;cursor:pointer;font-family:inherit}
.flake{position:absolute;color:#fff;opacity:.7;animation:fall linear infinite;pointer-events:none}
@keyframes fall{from{transform:translateY(-30px)}to{transform:translateY(560px)}}
input[type=file]{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="start">
  <h1 data-i18n="title"></h1>
  <p data-i18n="startP"></p>
  <button id="startBtn" data-i18n="startBtn"></button>
  <p style="font-size:13px;color:#777" data-i18n="startNoCam"></p>
</div>

<div id="help">
  <h3 data-i18n="titleH"></h3>
  <div data-i18n="h1"></div><div data-i18n="h2"></div><div data-i18n="h3"></div><div data-i18n="h4"></div><div data-i18n="h5"></div>
  <div class="k" data-i18n="hk"></div>
</div>

<div id="side">
  <button id="modeBtn"></button>
</div>

<button id="langBtn"></button>
<div id="status"></div>
<div id="banner"><div class="txt" data-i18n="banner"></div>
  <button class="dwell" id="skipBtn"><span data-i18n="skip"></span></button></div>
<button class="dwell" id="replayBtn"><span data-i18n="replay"></span></button>
<div id="greet"><div class="gcard"><div class="gin" id="gin">
  <div class="row">🎄 ⭐ 🎁</div>
  <div class="en">Merry Christmas</div>
  <div class="zh" data-i18n="greetZh"></div>
  <div class="gfoot"><button class="dwell" id="greetBtn"><span data-i18n="greetBtn"></span></button></div>
</div></div></div>
<div id="cam"><video id="video" playsinline muted></video><div id="camTip" data-i18n="camTip"></div><div id="camRz"></div></div>
<div id="toast"></div>
<div id="card"><div class="ph"><img id="cardImg" alt="" draggable="false"></div><div id="cardCap"></div></div>

<div id="ready">
  <div class="cane"><div class="rbox" id="rbox">
    <div class="deco" style="left:14px;top:10px">🔔</div>
    <div class="deco" style="right:14px;top:10px">🎄</div>
    <h2>Are you ready?</h2>
    <ul>
      <li data-i18n="r1"></li><li data-i18n="r2"></li><li data-i18n="r3"></li>
      <li data-i18n="r4"></li><li data-i18n="r5"></li><li data-i18n="r6"></li>
    </ul>
    <div class="modes"><b data-i18n="modeTitle"></b>
      <button class="dwell" id="m1" data-mode="1"><span data-i18n="m1"></span></button>
      <button class="dwell" id="m3" data-mode="3"><span data-i18n="m3"></span></button>
      <button class="dwell" id="m5" data-mode="5"><span data-i18n="m5"></span></button></div>
    <div class="go"><b data-i18n="go"></b> <span>👏</span></div>
    <div class="clapTip" data-i18n="clapTip"></div>
    <div id="clapMeter"><div id="clapSeen"></div><div class="bar"><i id="clapBar"></i></div></div>
    <div class="alt"><button id="readyBtn" data-i18n="readyBtn"></button></div>
  </div></div>
</div>

  const R = 21 * s * (1 + starBoost * .25), r = R * .42, pts = [];
  for (let i = 0; i < 10; i++) { const an = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r : R; pts.push([Math.cos(an) * rad, Math.sin(an) * rad]); }
  ctx.shadowColor = 'rgba(255,200,90,1)'; ctx.shadowBlur = 32 * s;
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
  ctx.fillStyle = '#ffc93d'; ctx.fill(); ctx.shadowBlur = 0;
  for (let i = 0; i < 10; i++) {
    const p1 = pts[i], p2 = pts[(i + 1) % 10];
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.closePath();
    ctx.fillStyle = i % 2 ? '#ffb31f' : '#ffe58f'; ctx.fill();
  }
  ctx.globalCompositeOperation = 'lighter';
  g = ctx.createRadialGradient(0, 0, 0, 0, 0, R * .9);
  g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(.4, 'rgba(255,250,220,.35)'); g.addColorStop(1, 'rgba(255,240,200,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R * .9, 0, TAU); ctx.fill();
  ctx.restore();
}
function drawTree() {
  const sq = state === 'ending' && endPhase === 'tree' ? charge : 0, cy0 = (tree.top + tree.bottom) / 2;
  const cx = tree.cx, top = cy0 - (cy0 - tree.top) * (1 - .18 * sq), bottom = cy0 + (tree.bottom - cy0) * (1 - .18 * sq);
  const R = tree.R * (1 - .3 * sq), th = bottom - top, rot = spin;
  tree.topNow = top;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    let e = Math.min(1, Math.max(0, (gather - p.d * .35) / .65)); e = e * e * (3 - 2 * e);
    const r = p.h * R * p.rf, an = p.a + rot, z = Math.sin(an) * r;
    const tx = cx + Math.cos(an) * r, ty = top + p.h * th + z * .16;
    const sx = p.sx * W + Math.sin(T * .35 + p.ph) * 18, sy = p.sy * H + Math.cos(T * .3 + p.ph) * 18;
    const jx = sq ? (Math.random() - .5) * sq * 4 * S : 0;
    const x = sx + (tx - sx) * e + jx, y = sy + (ty - sy) * e;
    const depth = r > 0 ? .5 + .5 * z / R : 1;
    let al = (.35 + .65 * depth) * (.55 + .45 * e);
    if (p.tw) al *= .45 + .55 * Math.max(0, Math.sin(T * 3 + p.tw));
    ctx.globalAlpha = al; ctx.fillStyle = p.col;
    const sz = p.sz * S * (.8 + .4 * depth);
    ctx.fillRect(x - sz / 2, y - sz / 2, sz, sz);
  }
  ctx.restore();
  // 彩球（无数字）
  const ba = Math.max(0, (gather - .82) / .18);
  if (ba > 0) {
    const hint = state === 'play' && !auto ? curNote().midi : -1;
    const list = balls.map(b => {
      const r = b.h * R * 1.0, an = b.a + rot;
      b.z = Math.sin(an); b.x = cx + Math.cos(an) * r; b.y = top + b.h * th + b.z * r * .16; return b;
    }).sort((a, b) => a.z - b.z);
    for (const b of list) {
      const depth = .5 + .5 * b.z, rad = (6.5 + 2 * depth) * S * (1 + b.glow * .45);
      ctx.save(); ctx.globalAlpha = ba * (.45 + .55 * depth);
      if (b.glow > .01 || b.key.midi === hint) {
        const gl = b.glow + (b.key.midi === hint ? .35 + .25 * Math.sin(T * 6) : 0);
        ctx.globalCompositeOperation = 'lighter';
        const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, rad * 4.5);
        g.addColorStop(0, b.key.color); g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.globalAlpha = ba * Math.min(1, gl); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, rad * 4.5, 0, TAU); ctx.fill();
        ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = ba * (.45 + .55 * depth);
      }
      const g2 = ctx.createRadialGradient(b.x - rad * .35, b.y - rad * .35, rad * .1, b.x, b.y, rad);
      g2.addColorStop(0, '#fff'); g2.addColorStop(.3, b.key.color); g2.addColorStop(1, 'rgba(0,0,0,.6)');
      ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(b.x, b.y, rad, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }
}
function drawBoards() {
  const hint = state === 'play' && !auto ? curNote().midi : -1;
  const nxt = state === 'play' && !auto ? nextNote().midi : -1;
  boards.forEach(b => {
    ctx.save();
    rr(b.x - 12 * S, b.y - 34 * S, b.w + 24 * S, b.h + 46 * S, 16 * S);
    ctx.fillStyle = 'rgba(10,14,30,.55)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,215,130,.35)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = '#f5d68a'; ctx.font = `${14 * S}px -apple-system,"PingFang SC",sans-serif`; ctx.textAlign = 'left';
    ctx.fillText(b.label, b.x, b.y - 12 * S);
    ctx.restore();
  });
  const drawKey = k => {
    const { x, y, w, h } = k.r, off = k.flash * 4 * S, isHint = k.midi === hint;
    ctx.save();
    if (isHint) { ctx.shadowColor = k.color; ctx.shadowBlur = (22 + 12 * Math.sin(T * 6)) * S; }
    rr(x, y + off, w, h, k.black ? 4 * S : 7 * S);
    let g = ctx.createLinearGradient(0, y, 0, y + h);
    if (k.black) { g.addColorStop(0, '#2a2a35'); g.addColorStop(1, '#0d0d12'); }
    else { g.addColorStop(0, '#fffdf7'); g.addColorStop(1, '#e6dfcf'); }
    ctx.fillStyle = g; ctx.fill(); ctx.shadowBlur = 0;
    const tint = Math.max(k.flash, isHint ? .45 + .2 * Math.sin(T * 6) : 0);
    if (tint > 0) { ctx.globalAlpha = tint * (k.black ? 1 : .85); ctx.fillStyle = k.color; ctx.fill(); ctx.globalAlpha = 1; }
    if (isHint) { ctx.strokeStyle = k.color; ctx.lineWidth = 3 * S; ctx.stroke(); }
    if (!k.black) {
      ctx.fillStyle = k.color; ctx.beginPath(); ctx.arc(x + w / 2, y + off + h - 34 * S, 5 * S, 0, TAU); ctx.fill();
      ctx.fillStyle = '#444'; ctx.textAlign = 'center'; ctx.font = `bold ${13 * S}px -apple-system,sans-serif`;
      ctx.fillText(k.name, x + w / 2, y + off + h - 16 * S);
      ctx.font = `${10 * S}px -apple-system,sans-serif`; ctx.fillStyle = '#888';
      ctx.fillText(SOLF[k.name], x + w / 2, y + off + h - 5 * S);
      if (k.midi === nxt && !isHint) { ctx.globalAlpha = .5; ctx.strokeStyle = k.color; ctx.setLineDash([4 * S, 4 * S]); ctx.lineWidth = 2 * S; rr(x + 3, y + 3, w - 6, h - 6, 6 * S); ctx.stroke(); }
    }
    ctx.restore();
    if (isHint) { // 跳动箭头
      const ay = y - 30 * S + Math.sin(T * 7) * 5 * S, ax = x + w / 2;
      ctx.save(); ctx.fillStyle = k.color; ctx.shadowColor = k.color; ctx.shadowBlur = 12 * S;
      ctx.beginPath(); ctx.moveTo(ax - 9 * S, ay); ctx.lineTo(ax + 9 * S, ay); ctx.lineTo(ax, ay + 12 * S); ctx.closePath(); ctx.fill(); ctx.restore();
    }
  };
  keys.filter(k => !k.black).forEach(drawKey);
  keys.filter(k => k.black).forEach(drawKey);
}
function drawTrails(dt) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = trails.length - 1; i >= 0; i--) {
    const tr = trails[i]; tr.t += dt / .55;
    if (tr.t >= 1 || gather < .9) { trails.splice(i, 1); continue; }
    const k = tr.k, b = k.ball, sx = k.r.x + k.r.w / 2, sy = k.r.y + k.r.h * .3;
    const e = 1 - Math.pow(1 - tr.t, 2), mx = (sx + b.x) / 2, my = Math.min(sy, b.y) - 60 * S;
    const x = (1 - e) * (1 - e) * sx + 2 * (1 - e) * e * mx + e * e * b.x, y = (1 - e) * (1 - e) * sy + 2 * (1 - e) * e * my + e * e * b.y;
    const g = ctx.createRadialGradient(x, y, 0, x, y, 12 * S);
    g.addColorStop(0, '#fff'); g.addColorStop(.3, k.color); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = 1 - tr.t * .5; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 12 * S, 0, TAU); ctx.fill();
  }
  ctx.restore();
}
const CONN = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function drawHands() {
  Object.values(hands).forEach(h => {
    if (!h.alive) return;
    const p = h.pts;
    ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 1.5 * S;
    CONN.forEach(([a, b]) => { ctx.beginPath(); ctx.moveTo(p[a].x, p[a].y); ctx.lineTo(p[b].x, p[b].y); ctx.stroke(); });
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    p.forEach(q => { ctx.beginPath(); ctx.arc(q.x, q.y, 2.5 * S, 0, TAU); ctx.fill(); });
    ctx.globalCompositeOperation = 'lighter';
    FINGERS.forEach(f => {
      const tip = f[3], fi = FINGERS.indexOf(f), q = p[tip];
      const col = '#ffe9a8', rad = 12 * S;
      const g = ctx.createRadialGradient(q.x, q.y, 0, q.x, q.y, rad);
      g.addColorStop(0, '#fff'); g.addColorStop(.35, col); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(q.x, q.y, rad, 0, TAU); ctx.fill();
    });
    ctx.restore();
  });
}
function drawSnow(dt) {
  if (Math.random() < dt * 6) spawnSnow(1);
  ctx.save(); ctx.fillStyle = '#fff';
  for (let i = flakes.length - 1; i >= 0; i--) {
    const f = flakes[i]; f.ph += dt; f.x += (f.vx + Math.sin(f.ph * 1.5) * 15) * dt; f.y += f.vy * dt;
    if (f.y > H + 10) { flakes.splice(i, 1); continue; }
    ctx.globalAlpha = .75; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * S, 0, TAU); ctx.fill();
  }
  ctx.restore();
}
function drawGatherHint() {
  const live = Object.values(hands).filter(h => h.alive).length;
  ctx.save(); ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.shadowColor = 'rgba(255,210,120,.8)'; ctx.shadowBlur = 16;
  ctx.font = `600 ${30 * S}px -apple-system,"PingFang SC",sans-serif`;
  ctx.globalAlpha = .75 + .25 * Math.sin(T * 2.5);
  ctx.fillText(live < 2 && landmarker ? t('gatherNoHand') : t('gather'), W / 2, H * .52);
  ctx.globalAlpha = .6; ctx.shadowBlur = 0; ctx.font = `${15 * S}px -apple-system,"PingFang SC",sans-serif`;
  ctx.fillText(t('gatherAlt'), W / 2, H * .52 + 34 * S);
  const bw = 260 * S, by = H * .52 + 56 * S;
  ctx.globalAlpha = 1; rr(W / 2 - bw / 2, by, bw, 8 * S, 4 * S); ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fill();
  rr(W / 2 - bw / 2, by, bw * gather, 8 * S, 4 * S); ctx.fillStyle = '#ffd36b'; ctx.fill();
  ctx.restore();
}

/* ---------------- 主循环 ---------------- */
function frame(now) {
  const dt = Math.min(.05, (now - lastFrame) / 1000); lastFrame = now; T += dt;
  detect(now);
  if (state === 'scatter') {
    if (holdGather || mouseHold || keyHold) gather = Math.min(1, gather + dt / 1.8);
    if (gather >= 1) {
      state = 'treeDone'; starBoost = 1; spawnSnow(60); treeChime();
      setTimeout(startIntro, 900);
    }
  }
  if (state === 'ending') endingStep(dt);
  {
    const regather = state === 'scatter' || (state === 'ending' && endPhase === 'scatter' && !exploding);
    gatherSfx(regather && (holdGather || mouseHold || keyHold) && gather < 1, gather);
  }
  const sq = state === 'ending' && endPhase === 'tree' ? charge : 0;
  spin += dt * (.25 + 2.4 * sq * sq);
  starBoost = Math.max(sq * .8, starBoost - dt * 1.2);
  keys.forEach(k => k.flash = Math.max(0, k.flash - dt / .35));
  balls.forEach(b => b.glow = Math.max(0, b.glow - dt / .7));
  ctx.clearRect(0, 0, W, H);
  drawSnow(dt);
  drawTree();
  drawStar(tree.cx, (tree.topNow || tree.top) - 8 * S, Math.min(1, gather * 1.2));
  if (state === 'intro' || state === 'ready' || state === 'play') { drawBoards(); drawTrails(dt); }
  if (state === 'scatter') drawGatherHint();
  if (state === 'ending' && !$('#greet').classList.contains('show')) drawEndHint();
  drawFireworks(dt, now);
  drawHands();
  requestAnimationFrame(frame);
}

/* ---------------- 交互 ---------------- */
let mouseHold = false, keyHold = false, mouseKey = null;
cv.addEventListener('mousedown', e => {
  initAudio();
  if (state === 'scatter' || state === 'ending') { mouseHold = true; return; }
  if (state === 'play') { const k = hitKey(e.clientX, e.clientY); if (k) { pressKey(k, 'user'); mouseKey = k; } }
});
cv.addEventListener('mousemove', e => {
  if (state !== 'play' || !(e.buttons & 1)) return;
  const k = hitKey(e.clientX, e.clientY);
  if (k && k !== mouseKey) pressKey(k, 'user');
  mouseKey = k;
});
addEventListener('mouseup', () => { mouseHold = false; mouseKey = null; });
addEventListener('keydown', e => {
  if (e.repeat) return;
  const c = e.key.toLowerCase();
  if (c === 'g') keyHold = true;
  if (c === ' ') { e.preventDefault(); if (state === 'ready') startPlay(); }
  if (c === 'a') toggleAuto();
  if (c === '[' || c === ']') {
    PRESS_T = Math.min(.9, Math.max(.15, PRESS_T + (c === ']' ? -.05 : .05)));
    toast((lang === 'zh' ? '手指灵敏度：' : 'Finger sensitivity: ') + Math.round((.9 - PRESS_T) / .75 * 10) + '/10');
  }
  if (c === 's' && state === 'intro') endIntro(true);
  if (c === 'h') toggleHelp();
  if (c === 'v') { const el = $('#cam'); if (video.srcObject) el.style.display = el.style.display === 'none' ? 'block' : 'none'; }
  if (c === 'f') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
});
addEventListener('keyup', e => { if (e.key.toLowerCase() === 'g') keyHold = false; });
function toggleHelp() { const el = $('#help'); el.style.display = el.style.display === 'none' ? 'block' : 'none'; }
$('#skipBtn').onclick = () => endIntro(true);
$('#readyBtn').onclick = () => { initAudio(); startPlay(); };
$('#modeBtn').onclick = () => setMode(playMode === 1 ? 3 : playMode === 3 ? 5 : 1);
document.querySelectorAll('.modes .dwell').forEach(b => b.onclick = () => setMode(+b.dataset.mode));

/* 摄像头小窗：拖动移动，拖右下角（或滚轮）缩放，双击还原；位置和大小会记住 */
(function () {
  const cam = $('#cam'), rz = $('#camRz');
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const place = (l, tp, w) => {
    w = clamp(w, 120, innerWidth * .8); const h = w * 9 / 16;
    cam.style.width = w + 'px'; cam.style.height = h + 'px'; cam.style.bottom = 'auto';
    cam.style.left = clamp(l, 0, innerWidth - w) + 'px'; cam.style.top = clamp(tp, 0, innerHeight - h) + 'px';
  };
  const save = () => { const r = cam.getBoundingClientRect(); try { localStorage.setItem('xmasCam2', JSON.stringify({ l: r.left, t: r.top, w: r.width })); } catch (e) {} };
  try { const c = JSON.parse(localStorage.getItem('xmasCam2') || 'null'); if (c) place(c.l, c.t, c.w); } catch (e) {}
  let drag = null;
  cam.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    const r = cam.getBoundingClientRect();
    drag = { mode: e.target === rz ? 'size' : 'move', x: e.clientX, y: e.clientY, l: r.left, t: r.top, w: r.width };
    cam.setPointerCapture(e.pointerId);
  });
  cam.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (drag.mode === 'move') place(drag.l + dx, drag.t + dy, drag.w);
    else place(drag.l, drag.t, drag.w + Math.max(dx, dy * 16 / 9));
  });
  const end = () => { if (drag) { drag = null; save(); } };
  cam.addEventListener('pointerup', end); cam.addEventListener('pointercancel', end);
  cam.addEventListener('wheel', e => {
    e.preventDefault(); const r = cam.getBoundingClientRect();
    place(r.left, r.top, r.width * (e.deltaY < 0 ? 1.08 : 1 / 1.08)); save();
  }, { passive: false });
  cam.addEventListener('dblclick', () => {
    cam.style.cssText = cam.style.display ? 'display:' + cam.style.display : '';
    try { localStorage.removeItem('xmasCam2'); } catch (e) {}
  });
  addEventListener('resize', () => { if (cam.style.top) { const r = cam.getBoundingClientRect(); place(r.left, r.top, r.width); } });
})();
$('#greetBtn').onclick = hideGreeting;
$('#replayBtn').onclick = replay;
// 禁止右键另存、拖拽图片（挡住随手保存）
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('dragstart', e => { if (e.target.tagName === 'IMG') e.preventDefault(); });

let toastTimer = null;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2200); }

/* 弹窗里的雪花 */
(function () {
  const box = $('#rbox');
  for (let i = 0; i < 18; i++) {
    const f = document.createElement('div'); f.className = 'flake'; f.textContent = '❄';
    f.style.left = Math.random() * 100 + '%'; f.style.top = '-20px';
    f.style.fontSize = (8 + Math.random() * 10) + 'px';
    f.style.animationDuration = (5 + Math.random() * 6) + 's'; f.style.animationDelay = (-Math.random() * 8) + 's';
    box.appendChild(f);
  }
})();

$('#startBtn').onclick = () => {
  initAudio();
  $('#start').style.display = 'none';
  state = 'scatter';
  $('#side').style.display = 'flex';
  initHands();
};
document.addEventListener('click', e => { const b = e.target.closest('button'); if (b) b.blur(); }, true);
$('#langBtn').onclick = () => { lang = lang === 'zh' ? 'en' : 'zh'; try { localStorage.setItem('xmasLang', lang); } catch (e) {} applyLang(); };
layout();
applyLang();
setMode(playMode, true);
requestAnimationFrame(frame);
</script>
